# Production overlay for a single-node deployment (ADR-026, DEPLOYMENT_GUIDE.md).
#
#   scripts/init-secrets.sh            # once: creates deploy/secrets/* (0600, git-ignored)
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# What it changes from the development stack:
# - APP_ENV=production: the API and AI service refuse to start without their
#   secrets, HTTPS origin and SMTP (strict config validation).
# - Secrets are mounted files (Docker secrets, *_FILE variables), never
#   environment values, so they do not appear in `docker inspect`.
# - Migrations run once in the `migrate` job before the API and worker start
#   (MIGRATE_ON_START=false), which is safe with several replicas.
# - Only `web` publishes a port, on loopback, for the TLS-terminating reverse
#   proxy in front of it (HSTS is set there; see DEPLOYMENT_GUIDE.md).
# - Containers run read-only, without Linux capabilities or privilege
#   escalation, with resource limits, restart policies and log rotation.
#
# Managed Postgres, Redis or S3 replace the bundled services by pointing the
# corresponding secret/variable at them and scaling the bundled one to 0.

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:size=64m"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app-secrets: &app-secrets
  APP_ENV: production
  MIGRATE_ON_START: "false"
  # Values come from the mounted files below; the plain variables stay empty.
  DATABASE_URL: ""
  DATABASE_URL_FILE: /run/secrets/database_url
  SESSION_SECRET: ""
  SESSION_SECRET_FILE: /run/secrets/session_secret
  DATA_ENCRYPTION_KEY: ""
  DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
  AI_SERVICE_TOKEN: ""
  AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
  SMTP_PASSWORD: ""
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_oauth_client_secret
  APP_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (https://your.domain) in .env}
  API_HTTP_SHUTDOWN_DRAIN: 5s
  # Bundled SeaweedFS: the API creates the private bucket. Set false for a
  # managed bucket provisioned (private, encrypted) by your infrastructure.
  S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    <<: *hardened
    read_only: false # Postgres needs its data directory and run sockets.
    cap_drop: []
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: !reset []
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  redis:
    <<: *hardened
    # Run as the redis user directly: the entrypoint's privilege drop needs
    # capabilities, and nothing is persisted (--save "").
    user: redis
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  storage:
    <<: *hardened
    read_only: false
    cap_drop: []
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  ai:
    <<: *hardened
    image: ${IMAGE_PREFIX:-careerpilot}/ai:${APP_VERSION:-dev}
    environment:
      APP_ENV: production
      AI_SERVICE_TOKEN: ""
      AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
    secrets: [ai_service_token, anthropic_api_key]
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }

  # Release step: applies migrations once. It receives only the database URL.
  migrate:
    <<: *hardened
    image: ${IMAGE_PREFIX:-careerpilot}/api:${APP_VERSION:-dev}
    build: ./services/api
    command: ["migrate", "up"]
    restart: "no"
    environment:
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardened
    image: ${IMAGE_PREFIX:-careerpilot}/api:${APP_VERSION:-dev}
    environment:
      <<: *app-secrets
      TRUST_PROXY_HEADERS: "true"
      API_HTTP_ADDR: ":8080"
    secrets: [database_url, session_secret, data_encryption_key, ai_service_token, smtp_password, google_oauth_client_secret]
    ports: !reset []
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  worker:
    <<: *hardened
    image: ${IMAGE_PREFIX:-careerpilot}/api:${APP_VERSION:-dev}
    stop_grace_period: 45s
    environment:
      <<: *app-secrets
    secrets: [database_url, session_secret, data_encryption_key, ai_service_token, smtp_password, google_oauth_client_secret]
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  web:
    <<: *hardened
    image: ${IMAGE_PREFIX:-careerpilot}/web:${APP_VERSION:-dev}
    # nginx writes its pid and temp files under /tmp (unprivileged image).
    tmpfs: ["/tmp:size=64m"]
    ports: !override
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:8080"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }

secrets:
  postgres_password: { file: ./deploy/secrets/postgres_password }
  database_url: { file: ./deploy/secrets/database_url }
  session_secret: { file: ./deploy/secrets/session_secret }
  data_encryption_key: { file: ./deploy/secrets/data_encryption_key }
  ai_service_token: { file: ./deploy/secrets/ai_service_token }
  anthropic_api_key: { file: ./deploy/secrets/anthropic_api_key }
  smtp_password: { file: ./deploy/secrets/smtp_password }
  google_oauth_client_secret: { file: ./deploy/secrets/google_oauth_client_secret }
