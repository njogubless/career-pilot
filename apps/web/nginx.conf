# Serves the SPA and reverse-proxies the API on the same origin (ADR-003).
# Note: security headers are set once at server level. No `location` block may
# use add_header, because that would silently drop the inherited headers.

# Edge rate limits per client address (ADR-026). The API also limits per
# user and per action; these stop floods before they reach it.
limit_req_zone $binary_remote_addr zone=cp_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cp_auth:10m rate=2r/s;
limit_req_status 429;

map $uri $cp_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $cp_cache_control always;

    # Sign-in, registration and password reset: tight burst at the edge.
    location /api/v1/auth/ {
        limit_req zone=cp_auth burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location /api/ {
        limit_req zone=cp_api burst=60 nodelay;
        # Matches the API's upload limit (MAX_UPLOAD_BYTES 10 MiB + form overhead);
        # nginx's 1 MiB default would reject ordinary CVs.
        client_max_body_size 11m;
        proxy_read_timeout 120s;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;  # API sets no-store; keep a single value
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
