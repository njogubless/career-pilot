# CareerPilot AI: local development / single-node staging stack.
# Usage: `make up` (everything) or `make infra` (Postgres, Redis, storage; run services on the host).
# Host ports avoid common defaults (ADR-013); override in .env.

name: careerpilot

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_VERSION: ${APP_VERSION:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-careerpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerpilot}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  AI_SERVICE_URL: http://ai:8090
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  S3_ENDPOINT: storage:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-careerpilot-documents}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  APP_BASE_URL: ${COMPOSE_APP_BASE_URL:-http://localhost:8088}
  SMTP_ADDR: ${SMTP_ADDR:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
  DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-6h}
  SEED_JOB_SOURCES: ${SEED_JOB_SOURCES:-true}
  DATA_ENCRYPTION_KEY_VERSION: ${DATA_ENCRYPTION_KEY_VERSION:-1}
  DATA_ENCRYPTION_KEYS_RETIRED: ${DATA_ENCRYPTION_KEYS_RETIRED:-}
  # Observability (ADR-026): internal metrics listener; tracing is off unless
  # an OTLP endpoint is set (the observability profile provides Jaeger).
  METRICS_ADDR: ":9100"
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Private S3-compatible object storage for development (SeaweedFS, KI-011).
  # The API creates the bucket in non-production environments.
  storage:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"careerpilot","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-58333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  ai:
    build: ./services/ai
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      <<: *api-env
      API_HTTP_ADDR: ":8080"
      # nginx (web) is the only client-facing proxy in this topology.
      TRUST_PROXY_HEADERS: "true"
      API_HTTP_SHUTDOWN_DRAIN: ${API_HTTP_SHUTDOWN_DRAIN:-0s}
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/careerpilot", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }

  # Durable background jobs (River): CV extraction now; discovery and workflows later.
  worker:
    build: ./services/api
    command: ["worker"]
    restart: unless-stopped
    # Longer than WORKER_SHUTDOWN_TIMEOUT (30s) so running jobs can finish.
    stop_grace_period: 45s
    environment:
      <<: *api-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:8080"
    depends_on:
      api: { condition: service_healthy }

  # ---- Optional: `docker compose --profile observability up -d` (ADR-026) ----
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env to send traces.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-59090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.29.0
    profiles: ["observability"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-59093}:9093"

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${JAEGER_HOST_PORT:-56686}:16686"

volumes:
  pgdata:
  s3data:
  promdata:
