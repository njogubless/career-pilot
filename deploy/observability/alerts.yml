# Alert rules (ADR-026). Thresholds are starting points for a small
# deployment; tune them with real traffic. Each alert names a runbook section
# in docs/OPERATIONS_RUNBOOK.md.
groups:
  - name: careerpilot-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not reachable by Prometheus"
          runbook: "OPERATIONS_RUNBOOK.md#alert-servicedown"
      - alert: APIHighErrorRate
        expr: |
          sum(rate(careerpilot_http_requests_total{job="api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(careerpilot_http_requests_total{job="api"}[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of API requests are failing with 5xx"
          runbook: "OPERATIONS_RUNBOOK.md#alert-apihigherrorrate"
      - alert: APIHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(careerpilot_http_request_duration_seconds_bucket{job="api"}[5m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 2s"
          runbook: "OPERATIONS_RUNBOOK.md#alert-apihighlatency"
      - alert: DatabasePoolSaturated
        expr: careerpilot_db_pool_acquired_connections / careerpilot_db_pool_max_connections > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} is using over 90% of its database connections"
          runbook: "OPERATIONS_RUNBOOK.md#alert-databasepoolsaturated"

  - name: careerpilot-background
    rules:
      - alert: JobQueueBacklog
        expr: careerpilot_queue_oldest_available_seconds > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Background jobs have waited more than 15 minutes to run"
          runbook: "OPERATIONS_RUNBOOK.md#alert-jobqueuebacklog"
      - alert: JobsDiscarded
        expr: sum(careerpilot_queue_discarded_last_hour) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5 background jobs exhausted their retries in the last hour"
          runbook: "OPERATIONS_RUNBOOK.md#alert-jobsdiscarded"
      - alert: SchedulesOverdue
        expr: careerpilot_schedules_overdue > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Workflow schedules are not firing"
          runbook: "OPERATIONS_RUNBOOK.md#alert-schedulesoverdue"
      - alert: QueueMetricsFailing
        expr: careerpilot_queue_collector_up == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The worker cannot read queue state from Postgres"
          runbook: "OPERATIONS_RUNBOOK.md#alert-queuemetricsfailing"

  - name: careerpilot-ai
    rules:
      - alert: AIServiceErrors
        expr: |
          sum(rate(careerpilot_http_requests_total{job="ai",status=~"5.."}[10m]))
            / clamp_min(sum(rate(careerpilot_http_requests_total{job="ai"}[10m])), 0.001) > 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 10% of AI service requests fail (LLM provider or model errors)"
          runbook: "OPERATIONS_RUNBOOK.md#alert-aiserviceerrors"
