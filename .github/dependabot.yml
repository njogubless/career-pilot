# Weekly dependency update PRs (security updates are raised as they appear).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /services/ai
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: ["/services/api", "/services/ai", "/apps/web"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
