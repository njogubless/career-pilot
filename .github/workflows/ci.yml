name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x',check-latest: true, cache-dependency-path: services/api/go.sum }
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Tests (unit + integration against the Postgres service)
        env: { TEST_DATABASE_URL: "postgres://ci:ci@localhost:5432/ci?sslmode=disable" }
        run: go test -race ./...
      - name: Migrations apply against Postgres
        env: { DATABASE_URL: "postgres://ci:ci@localhost:5432/ci?sslmode=disable" }
        run: go run ./cmd/careerpilot migrate up && go run ./cmd/careerpilot migrate status
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/ai/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: pip install pip-audit && pip-audit --require-hashes -r requirements.lock

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  # Deployment configuration: scripts, alert rules, proxy and Compose files.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        working-directory: scripts
        run: docker run --rm -v "$PWD:/s:ro" -w /s koalaman/shellcheck:v0.11.0 -x -S warning -- ./*.sh
      - name: Alert rules (syntax and unit tests)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/c:ro" -w /c prom/prometheus:v3.7.3 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/c:ro" -w /c prom/prometheus:v3.7.3 test rules alerts_test.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/observability:/c:ro" prom/alertmanager:v0.29.0 check-config /c/alertmanager.yml
      - name: nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginxinc/nginx-unprivileged:1.29.3-alpine nginx -t
      - name: Compose files (development and production overlay)
        env:
          POSTGRES_PASSWORD: ci
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          PUBLIC_BASE_URL: https://ci.example
        run: |
          docker compose config -q
          mkdir -p deploy/secrets && for f in postgres_password database_url session_secret data_encryption_key ai_service_token anthropic_api_key smtp_password google_oauth_client_secret; do touch deploy/secrets/$f; done
          docker compose -f docker-compose.yml -f deploy/compose.prod.yml config -q
      - name: Database roles (throwaway Postgres; migrations as owner, app as least privilege)
        run: scripts/check-db-roles.sh

  # Secrets must never be committed (full history).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner

  # Build every image and fail on fixable HIGH/CRITICAL vulnerabilities.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: services/api }
          - { name: ai, context: services/ai }
          - { name: web, context: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: careerpilot-${{ matrix.name }}:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: careerpilot-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
