# Prometheus for the Compose "observability" profile (ADR-026).
# Scrapes the internal metrics listeners; none of them is reachable through
# the public web proxy.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:9100"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9100"] }]
  - job_name: ai
    metrics_path: /metrics
    static_configs: [{ targets: ["ai:8090"] }]
